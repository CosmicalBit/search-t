[package]
name = "sf"
version = "0.1.0"
edition = "2024"

[dependencies]
memchr = "2.8.3"
owo-colors = "4.3.0"
rayon = "1.12.0"
sysinfo = "0.39.6"

[profile.release]
opt-level = 3
lto = "fat"
strip = "symbols"
panic = "abort"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
# Groups
all = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

# Error handling
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "warn"

# Security-relevant mistakes
mem_forget = "deny"
exit = "warn"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"

# Maintainability
large_stack_arrays = "warn"
large_futures = "warn"
needless_pass_by_value = "warn"
redundant_clone = "deny"
