name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu

jobs:
  release:
    name: Build and publish Linux binary
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches Cargo.toml
        shell: bash
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match Cargo.toml version $package_version" >&2
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --locked --target "$TARGET"

      - name: Package binary and checksum
        shell: bash
        run: |
          archive="search-t-${GITHUB_REF_NAME}-${TARGET}.tar.gz"
          tar -C "target/${TARGET}/release" -czf "$archive" search-t
          sha256sum "$archive" > "${archive}.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$ARCHIVE" "$ARCHIVE.sha256"
          --generate-notes
          --title "$GITHUB_REF_NAME"
